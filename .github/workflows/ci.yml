name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra ui

      - name: Plugin manifest version matches pyproject.toml
        run: python3 scripts/check_plugin_version.py --check

      - name: Ruff lint
        run: uv run ruff check deepvista_cli/

      - name: Ruff format
        run: uv run ruff format --check deepvista_cli/

      - name: Pyright
        run: uv run pyright deepvista_cli/

      - name: Security scan (bandit)
        run: uv run --with bandit bandit -r deepvista_cli/ -ll -q

      - name: Dependency vulnerability check
        run: uv run --with pip-audit pip-audit

      - name: Install gh >= 2.90 (gh skill requires it)
        run: |
          GH_VERSION=2.90.0
          curl -sL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local --strip-components=1
          gh --version

      - name: Validate skills (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skill publish --dry-run

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse install.ps1 (syntax check)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install deepvista CLI from checkout
        run: uv tool install ".[ui]"

      - name: Smoke test - deepvista --help
        run: deepvista --help
