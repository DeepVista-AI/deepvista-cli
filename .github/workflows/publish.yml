name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
          - clawhub
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version = "//;s/"//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'pypi' || github.event.inputs.target == 'all'))
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-clawhub:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'clawhub' || github.event.inputs.target == 'all'))
    needs: build
    runs-on: ubuntu-latest
    environment: clawhub
    steps:
      - uses: actions/checkout@v4

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Publish skills to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            echo "Publishing $skill_name v$VERSION..."

            clawhub publish "$skill_dir" \
              --slug "$skill_name" \
              --version "$VERSION" \
              --tags latest \
              --changelog "Release v$VERSION" \
              || echo "  Warning: Failed to publish $skill_name (may already exist at this version)"
          done

          echo ""
          echo "Skills published to: https://clawhub.ai/skills"
