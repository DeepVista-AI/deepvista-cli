repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        entry: uv run pyright deepvista_cli/
        pass_filenames: false
        types: [python]

      - id: plugin-version-sync
        name: plugin.json version matches pyproject.toml
        language: system
        entry: python3 scripts/check_plugin_version.py
        pass_filenames: false
        files: ^(pyproject\.toml|plugins/claude-code/\.claude-plugin/plugin\.json)$
