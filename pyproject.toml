[project]
name = "deepvista-cli"
version = "0.1.0a6"
description = "CLI for DeepVista — chat, notes, recipes, and memory from your terminal."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "DeepVista AI", email = "crew@deepvista.ai" }]
keywords = ["deepvista", "cli", "knowledge-base", "ai", "notes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "filelock>=3.12",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
ui = [
    "textual>=0.80",
]

[project.urls]
Homepage = "https://deepvista.ai"
Repository = "https://github.com/DeepVista-AI/deepvista-cli"
Issues = "https://github.com/DeepVista-AI/deepvista-cli/issues"

[project.scripts]
deepvista = "deepvista_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepvista_cli"]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1",
    "ruff>=0.4",
    "skills-ref>=0.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
